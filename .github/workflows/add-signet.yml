name: add-signet
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: add-signet
  cancel-in-progress: false
jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils d'image
        run: npm install --no-save --prefix signets/tools sharp || true
      - name: Ajouter le signet
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node signets/tools/add.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add signets/adds
          git commit -m "Nouveau signet" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 3; done
      - name: Fermer la demande
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Signet ajouté ✅"
