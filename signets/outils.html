<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signets">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="sg.js"></script>
<title>Outils · Signets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column, sticky tab bar, each tab a working tool. */
:root{
  color-scheme:dark;
  --bg:#3f4a5c; --card:rgba(255,255,255,.10); --ink:#ffffff; --mute:rgba(255,255,255,.76); --line:rgba(255,255,255,.20);
  --acc:#6fd8c8; --acc-ink:#0c1a18; --acc-soft:rgba(111,216,200,.24); --pin:#7cc0ff; --pin-dim:rgba(255,255,255,.28);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html{background:#2f3949}
option{color:#111}
input::placeholder{color:rgba(255,255,255,.72)}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,#5b6d83 0%,#4a586b 30%,#3a4557 65%,#2c3544 100%);background-size:100% 100%;min-height:100vh;color:var(--ink);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#5b6d83}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4.5vw,36px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
.sub{color:var(--mute);margin:4px 0 0;max-width:65ch}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(74,88,107,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;margin-top:10px;border-bottom:1px solid var(--line)}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
section.view{padding-top:20px;display:grid;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--mute)}
.small{font-size:13px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input[type=search],select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.mapgrid{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.arr{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.arr.on{fill:var(--acc-soft)}
.arrl{fill:var(--mute);font:600 15px var(--body);pointer-events:none;text-anchor:middle;dominant-baseline:middle;opacity:.7}
.pin{fill:var(--pin);stroke:var(--card);stroke-width:2;cursor:pointer}
.pin.dim{fill:var(--pin-dim)}
.pin.sel{fill:var(--acc);r:9}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12.5px;max-width:240px;transform:translate(-50%,-115%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;gap:8px;max-height:640px;overflow:auto;padding-right:4px}
.place{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.place.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.place b{display:block;font-weight:600}
.place .a{font-size:13px;color:var(--mute)}
.place .c{font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place .f{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute)}
/* menus */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dish .d{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.dish b{font-family:var(--display);font-size:17px;line-height:1.25}
.ings{display:flex;flex-wrap:wrap;gap:4px}
.ings i{font-style:normal;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.dish .f{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px}
.dish .f button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px}
.shop label{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.shop label.done span{text-decoration:line-through;color:var(--mute)}
.shop .q{margin-left:auto;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
/* bilan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--pin)}
.chart .bar:hover,.chart .bar.hl{fill:var(--acc)}
.chart .ax{fill:var(--mute);font:12px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hbars{display:grid;gap:6px}
.hb{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:13.5px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{display:block;height:12px;border-radius:4px;background:var(--bg);overflow:hidden}
.hb .fill{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--pin)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:3px 10px 3px 0;text-align:left;border-bottom:1px solid var(--line)}
/* cadeaux */
.note{border-left:3px solid var(--acc);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gift{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gift p{margin:0;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.gift .f{margin-top:auto;display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.loading{padding:40px 0;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <p style="margin:0 0 6px"><a href="./" style="text-decoration:none;font-weight:600">← Mes signets</a></p>
    <h1>Mes outils</h1>
    <p class="sub" id="sub">Tes enregistrements Instagram transformés en outils : où manger, quoi cuisiner, ton bilan, ton golf et quoi offrir.</p>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#plans" data-v="plans">🍎 Export Plans</a>
    <a href="#google" data-v="google">🗺️ Google Maps</a>
    <a href="#carte" data-v="carte">📍 Carte des restos</a>
    <a href="#menus" data-v="menus">🥕 Menus de saison</a>
    <a href="#bilan" data-v="bilan">📊 Ton bilan</a>
    <a href="#golf" data-v="golf">⛳ Golf</a>
    <a href="#cadeaux" data-v="cadeaux">🎁 Idées cadeaux</a>
  </nav>
  <main id="out"><p class="loading">Chargement de tes signets…</p></main>
</div>

<script>
const TAB=[["pomme de terre","peah"],["noix de coco","peah"],["asperge","p"],["radis","p"],["petit pois","p"],["fraise","pe"],["rhubarbe","p"],["artichaut","pe"],["epinard","ph"],["feve","p"],["tomate","e"],["courgette","e"],["aubergine","e"],["poivron","e"],["concombre","e"],["melon","e"],["abricot","e"],["basilic","e"],["framboise","e"],["cerise","pe"],["haricot vert","e"],["pasteque","e"],["nectarine","e"],["potiron","ah"],["courge","ah"],["butternut","ah"],["champignon","ah"],["chataigne","a"],["noix","a"],["raisin","ea"],["pomme","ah"],["poire","ah"],["figue","ea"],["betterave","ah"],["brocoli","ah"],["chou","ah"],["poireau","ah"],["endive","h"],["mandarine","h"],["clementine","h"],["orange","h"],["citron","h"],["navet","ah"],["panais","ah"],["celeri","ah"],["topinambour","h"],["kiwi","h"],["carotte","peah"]];
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const nf=n=>Number(n).toLocaleString('fr-FR');
const fdate=t=>new Date(t*1000).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const mshort=t=>new Date(t*1000).toLocaleDateString('fr-FR',{month:'short',year:'numeric'});
const store={get(k,d){try{const v=localStorage.getItem('sp-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('sp-'+k,JSON.stringify(v))}catch(e){}}};
let DATA=null;

/* ---------------- Carte ---------------- */
const M={type:'Tous',ar:0,q:'',sel:-1,kind:'Tous'};
function vCarte(){
  const P=DATA.places, m=DATA.map;
  const types={};P.forEach(p=>types[p.t]=(types[p.t]||0)+1);
  const tl=Object.entries(types).sort((a,b)=>b[1]-a[1]);
  const ars={};P.forEach(p=>ars[p.ar]=(ars[p.ar]||0)+1);
  return `<a class="note" href="#plans" style="display:block;text-decoration:none;color:inherit"><b>🍎 Envoyer ces adresses dans Plans d'Apple</b> · 14 guides prêts, touche ici →</a>
  <div class="row" role="group" aria-label="Type de cuisine">${['Tous',...tl.map(t=>t[0])].map(t=>`<button class="chip" data-type="${esc(t)}" aria-pressed="${M.type===t}">${esc(t)}<span class="n">${t==='Tous'?P.length:types[t]}</span></button>`).join('')}</div>
  <div class="row"><input id="mq" type="search" placeholder="Chercher un nom, une rue, un compte" value="${esc(M.q)}" style="flex:1;min-width:200px">
  <select id="mar" aria-label="Arrondissement"><option value="0">Tous les arrondissements</option>${Array.from({length:20},(_,i)=>i+1).map(n=>`<option value="${n}"${M.ar===n?' selected':''}>${n}${n===1?'er':'e'} · ${ars[n]||0}</option>`).join('')}</select></div>
  <div class="mapgrid">
    <div class="mapbox" id="mapbox"><svg viewBox="-10 -10 ${m.w+20} ${m.h+20}" role="img" aria-label="Carte de Paris avec tes adresses enregistrées">
      ${m.arr.map(a=>`<path class="arr" data-ar="${a.n}" d="${a.d}"/>`).join('')}
      ${m.arr.map(a=>`<text class="arrl" x="${a.cx}" y="${a.cy}">${a.n}</text>`).join('')}
      <g id="pins"></g></svg><div class="tip" id="tip" hidden></div></div>
    <div><p class="small muted" id="mcount" style="margin:0 0 8px"></p><div class="list" id="mlist"></div></div>
  </div>
  <details class="panel"><summary>${DATA.far.length} adresses hors de Paris</summary><div class="list" style="margin-top:10px;max-height:none">${DATA.far.map(p=>placeCard(p,-1,true)).join('')}</div></details>
  <p class="small muted">Adresses relevées dans les légendes de tes publications puis placées avec la Base Adresse Nationale. Les noms sont repris tels quels des légendes : quand il n'y en a pas, c'est le compte qui l'a publiée. Vérifie qu'une adresse est toujours ouverte avant d'y aller. Le lien « Plans » ouvre l'adresse dans Plans d'Apple, où tu peux l'ajouter à un guide.</p>`;
}
function placeCard(p,i,far){
  return `<div class="place${i===M.sel?' sel':''}" ${i>=0?`data-pi="${i}" role="button" tabindex="0"`:''}><b>${esc(p.n)}</b><span class="a">${esc(p.a)}</span>${p.c?`<div class="c">${esc(p.c)}</div>`:''}<div class="f"><span class="tag">${esc(p.t)}</span><span>@${esc(p.acc)}</span><a href="${esc(p.u)}" target="_blank" rel="noopener" style="margin-left:auto">Post ↗</a><a href="https://maps.apple.com/?q=${encodeURIComponent(p.n)}&address=${encodeURIComponent(p.a)}&ll=${p.lat},${p.lon}" target="_blank" rel="noopener">Plans ↗</a></div></div>`;
}
function mapFilter(){
  const q=norm(M.q);
  return DATA.places.map((p,i)=>({p,i})).filter(({p})=>(M.type==='Tous'||p.t===M.type)&&(!M.ar||p.ar===M.ar)&&(!q||norm(p.n+' '+p.a+' '+p.acc+' '+p.c).includes(q)));
}
function drawMap(){
  const L=mapFilter(), on=new Set(L.map(x=>x.i));
  document.querySelectorAll('.arr').forEach(a=>a.classList.toggle('on',+a.dataset.ar===M.ar));
  $('#pins').innerHTML=DATA.places.map((p,i)=>`<circle class="pin${on.has(i)?'':' dim'}${i===M.sel?' sel':''}" data-pi="${i}" cx="${p.x}" cy="${p.y}" r="${on.has(i)?7:4}"/>`).join('')
    .replace(/(<circle[^>]*class="pin(?! dim)[^"]*"[^>]*>)/g,'$1'); // keep order
  // bring active pins to front
  const g=$('#pins');[...g.querySelectorAll('.pin:not(.dim)')].forEach(c=>g.appendChild(c));const s=g.querySelector('.sel');if(s)g.appendChild(s);
  $('#mcount').textContent=`${L.length} adresse${L.length>1?'s':''}${M.type!=='Tous'?' · '+M.type:''}${M.ar?' · '+M.ar+(M.ar===1?'er':'e'):''}`;
  $('#mlist').innerHTML=L.length?L.slice(0,150).map(({p,i})=>placeCard(p,i)).join('')+(L.length>150?`<p class="small muted">Affine la recherche pour voir les ${L.length-150} autres.</p>`:''):'<p class="muted">Aucune adresse pour ce filtre. Enlève un critère.</p>';
}
function selectPlace(i,scroll){
  M.sel=i;drawMap();
  if(scroll){const el=document.querySelector(`.place[data-pi="${i}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}
}

/* ---------------- Menus ---------------- */
const SN={p:"Printemps",e:"Été",a:"Automne",h:"Hiver"},SO=["Printemps","Été","Automne","Hiver"];
function seas(ings){const sc={p:0,e:0,a:0,h:0};let n=0;for(const i of ings){const x=norm(i),t=TAB.find(([k])=>x.includes(k));if(t){n++;for(const c of t[1])sc[c]++}}
 if(!n)return "Toute l'année";let ks=Object.keys(sc).filter(k=>sc[k]===n);if(ks.length===4)return "Toute l'année";if(!ks.length){const m=Math.max(...Object.values(sc));ks=Object.keys(sc).filter(k=>sc[k]===m)}return SN[ks[0]]}
const SWEET=/^(sucre|chocolat|cacao|nutella|speculoos|cassonade|vergeoise|vanille|mascarpone|caramel)$/;
const SAVORY=/^(ail|oignon|echalote|poulet|jambon|parmesan|lardon|chorizo|bacon|saumon|thon|steak|boeuf|porc|veau|dinde|cabillaud|tofu|pates|riz|spaghetti|tagliatelle|gnocchi|curry|cumin|paprika|lentille|pois chiche|moutarde|feta|mozzarella|comte|chevre|gruyere|emmental)$/;
const PANTRY=/^(sel|poivre|huile|huile d'olive|sucre|farine|beurre|levure|vinaigre|paprika|cumin|curry|curcuma|cannelle|thym|romarin|vanille|miel|moutarde|bicarbonate|cacao|ail|oignon)$/;
function season(){const m=new Date().getMonth();return m<2||m===11?'Hiver':m<5?'Printemps':m<8?'Été':'Automne'}
const MN={season:season(),n:5,seed:null,pick:null};
function recPool(){
  const R=DATA.rec.map((r,i)=>({...r,ing:r.i,i,s:seas(r.i),sweet:r.i.some(x=>SWEET.test(norm(x)))&&!r.i.some(x=>SAVORY.test(norm(x)))}));
  return R;
}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function buildMenu(force){
  const R=recPool(), ok=r=>r.s===MN.season||r.s==="Toute l'année";
  const sav=R.filter(r=>!r.sweet&&ok(r)), sw=R.filter(r=>r.sweet&&ok(r));
  const saved=store.get('menu',null);
  if(!force&&saved&&saved.season===MN.season&&saved.n===MN.n&&saved.pick.every(i=>R[i])){MN.pick=saved.pick;return}
  const pick=[];const pool=[...sav].sort((a,b)=>(b.s===MN.season)-(a.s===MN.season)||Math.random()-.5);
  // favour in-season, then shuffle
  const inS=sav.filter(r=>r.s===MN.season).sort(()=>Math.random()-.5), rest=sav.filter(r=>r.s!==MN.season).sort(()=>Math.random()-.5);
  for(const r of [...inS.slice(0,Math.ceil(MN.n*0.6)),...rest,...inS.slice(Math.ceil(MN.n*0.6))]){if(pick.length>=MN.n)break;if(!pick.includes(r.i))pick.push(r.i)}
  if(sw.length)pick.push(rnd(sw).i);
  MN.pick=pick;store.set('menu',{season:MN.season,n:MN.n,pick});store.set('shop',[]);
}
function swapDish(k){
  const R=recPool(), cur=R[MN.pick[k]], ok=r=>(r.s===MN.season||r.s==="Toute l'année")&&r.sweet===cur.sweet&&!MN.pick.includes(r.i);
  const c=R.filter(ok);if(!c.length)return;MN.pick[k]=rnd(c).i;store.set('menu',{season:MN.season,n:MN.n,pick:MN.pick});
}
function vMenus(){
  if(!MN.pick)buildMenu(false);
  const R=recPool(), D=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const dishes=MN.pick.map(i=>R[i]);
  const cnt={};dishes.forEach(d=>d.ing.forEach(x=>{const k=norm(x).replace(/^oeufs?$/,'oeuf').replace(/^œufs?$/,'oeuf');cnt[k]=(cnt[k]||0)+1}));
  const fresh=Object.entries(cnt).filter(([k])=>!PANTRY.test(k)).sort((a,b)=>a[0].localeCompare(b[0],'fr'));
  const pantry=Object.entries(cnt).filter(([k])=>PANTRY.test(k)).sort((a,b)=>a[0].localeCompare(b[0],'fr'));
  const done=new Set(store.get('shop',[]));
  const nS=R.filter(r=>r.s===MN.season).length;
  let si=0;
  return `<div class="row"><div role="group" aria-label="Saison" class="row">${SO.map(s=>`<button class="chip" data-season="${s}" aria-pressed="${MN.season===s}">${s}<span class="n">${R.filter(r=>r.s===s).length}</span></button>`).join('')}</div>
   <label class="small muted" style="margin-left:auto">Dîners <select id="mn">${[3,4,5,6,7].map(n=>`<option${n===MN.n?' selected':''}>${n}</option>`).join('')}</select></label>
   <button class="btn" id="newmenu">Nouveau menu</button></div>
  <p class="small muted" style="margin:0">${MN.n} dîners tirés de tes ${nf(DATA.rec.length)} recettes enregistrées, en privilégiant les ${nf(nS)} recettes de ${MN.season.toLowerCase()}, plus un dessert. Le menu reste le même sur cet appareil jusqu'à ce que tu en demandes un nouveau.</p>
  <div class="menu">${dishes.map((d,k)=>`<article class="dish"><span class="d">${d.sweet?'Dessert':D[si++]}</span><b>${esc(d.t)}</b><div class="ings">${d.ing.map(x=>`<i>${esc(x)}</i>`).join('')}</div>

function barChart(vals,labels,opt){
  const W=opt.w||760,H=opt.h||200,pl=36,pb=26,pt=10,n=vals.length,max=Math.max(...vals)||1;
  const step=Math.pow(10,Math.floor(Math.log10(max)));const tick=[1,2,5,10].map(m=>m*step).find(t=>max/t<=5);const top=Math.ceil(max/tick)*tick;
  const bw=(W-pl)/n, gap=Math.min(2,bw*.2);
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';for(let t=0;t<=top;t+=tick)g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl-6}" y="${y(t)+4}" text-anchor="end">${nf(t)}</text>`;
  const bars=vals.map((v,i)=>{const x=pl+i*bw+gap/2,w=Math.max(1,bw-gap),h=y(0)-y(v);
    return `<rect class="bar${opt.hl&&opt.hl(i)?' hl':''}" data-tt="${esc(opt.tt(i))}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="${Math.min(3,w/2)}"/>`}).join('');
  const xl=labels.map((l,i)=>l?`<text class="ax" x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`:'').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">${g}${bars}${xl}</svg><div class="tip" hidden></div></div>`;
}
function hbars(rows,max,color){return `<div class="hbars">${rows.map(r=>`<div class="hb" title="${esc(r.l)} : ${nf(r.v)}"><span class="lab">${esc(r.l)}</span><span class="track"><span class="fill" style="width:${(r.v/max*100).toFixed(1)}%${r.c?';background:'+r.c:''}"></span></span><span class="v">${nf(r.v)}</span></div>`).join('')}</div>`}
function vBilan(){

document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('[data-dl]');if(!a||!DATA)return;e.preventDefault();
  const P=[...DATA.places,...DATA.far].filter(p=>p.lat&&p.lon);
  const xe=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let txt,type,name;
  if(a.dataset.dl==='kml'){
    const by={};P.forEach(p=>(by[p.t]=by[p.t]||[]).push(p));
    txt='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Restos Instagram</name>'+Object.entries(by).map(([t,L])=>'<Folder><name>'+xe(t)+'</name>'+L.map(p=>'<Placemark><name>'+xe(p.n)+'</name><description>'+xe(p.a+' - post de @'+p.acc+' : '+p.u)+'</description><Point><coordinates>'+p.lon+','+p.lat+',0</coordinates></Point></Placemark>').join('')+'</Folder>').join('')+'</Document></kml>';
    type='application/vnd.google-earth.kml+xml';name='restos-instagram.kml';
  }else{
    const q=t=>'"'+String(t??'').replace(/"/g,'""')+'"';
    txt='﻿'+[['Nom','Adresse','Latitude','Longitude','Type','Compte','Lien']].concat(P.map(p=>[p.n,p.a,p.lat,p.lon,p.t,'@'+p.acc,p.u])).map(r=>r.map(q).join(',')).join('\r\n');
    type='text/csv;charset=utf-8';name='restos-instagram.csv';
  }
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([txt],{type}));l.download=name;document.body.appendChild(l);l.click();l.remove();
});
</script>
</body></html>
